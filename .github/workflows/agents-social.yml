name: "Agents — Social Marketing"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 태스크"
        required: true
        default: "social-poster"
        type: choice
        options:
          - social-poster
          - social-metrics
          - channel-seeder
          - seo-optimizer
          - threads-token-refresh
          - google-ads-report
          - test-validate
          - test-post
  schedule:
    # google-ads-report cron 제거 — DISPATCH ONLY (패키지 미설치, refresh_token 미설정)
    # - cron: "17 0 * * *"   # 09:17 KST — 전일 성과 리포트 (2026-05-15 제거)
    # 텍스트 게시 (Threads) — 황금 시간대
    - cron: "17 22 * * *"  # 07:17 KST — 아침 황금시간
    - cron: "17 3 * * *"   # 12:17 KST — 점심 황금시간
    # 카드뉴스 v2 게시 — 중단 2026-05-15
    # - cron: "17 6 * * *"   # 15:17 KST — 오후 황금시간 (카드뉴스 중단)
    # 채널 시딩 — 중단 2026-05-15
    # - cron: "30 2 * * *"   # 11:30 KST — 채널 초안 (초기 시딩 완료)
    # 메트릭 수집
    - cron: "17 11 * * *"  # 20:17 KST — 성과 수집
    # SNS 리뷰/전략 — 중단 2026-05-15 (Threads 단독 운영, 데이터 부족)
    # - cron: "7 1 * * 1,4"    # 월+목 10:07 KST — reviewer (중단)
    # - cron: "15 1 * * 1,4"   # 월+목 10:15 KST — strategy (중단)
    # 주간 SEO — 중단 2026-05-16 (Slack 리포트만, 참고 안 함 → DISPATCH ONLY)
    # - cron: "17 23 * * 0"  # 월 08:17 KST — SEO 모니터
    # Threads 토큰 갱신
    - cron: "17 1 * * 3"   # 수 10:17 KST — threads token refresh

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  social-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'social-poster' ||
      github.event_name == 'schedule' && (github.event.schedule == '17 22 * * *' || github.event.schedule == '17 3 * * *')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: cd agents && npm ci
      - run: cd agents && npx tsx cron/runner.ts cmo social-poster
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_LIGHT: claude-haiku-4-5
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CHANNEL_DASHBOARD: ${{ secrets.SLACK_CHANNEL_DASHBOARD }}
          SLACK_CHANNEL_REPORT: ${{ secrets.SLACK_CHANNEL_REPORT }}
          SLACK_CHANNEL_QA: ${{ secrets.SLACK_CHANNEL_QA }}
          SLACK_CHANNEL_SYSTEM: ${{ secrets.SLACK_CHANNEL_SYSTEM }}
          SLACK_CHANNEL_LOG: ${{ secrets.SLACK_CHANNEL_LOG }}
          SLACK_CHANNEL_AGENT: ${{ secrets.SLACK_CHANNEL_AGENT }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.AUTH_URL }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

  social-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'social-metrics' ||
      github.event_name == 'schedule' && github.event.schedule == '17 11 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: cd agents && npm ci
      - run: cd agents && npx tsx cron/runner.ts cmo social-metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CHANNEL_DASHBOARD: ${{ secrets.SLACK_CHANNEL_DASHBOARD }}
          SLACK_CHANNEL_REPORT: ${{ secrets.SLACK_CHANNEL_REPORT }}
          SLACK_CHANNEL_QA: ${{ secrets.SLACK_CHANNEL_QA }}
          SLACK_CHANNEL_SYSTEM: ${{ secrets.SLACK_CHANNEL_SYSTEM }}
          SLACK_CHANNEL_LOG: ${{ secrets.SLACK_CHANNEL_LOG }}
          SLACK_CHANNEL_AGENT: ${{ secrets.SLACK_CHANNEL_AGENT }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

  threads-token-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'threads-token-refresh' ||
      github.event_name == 'schedule' && github.event.schedule == '17 1 * * 3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: cd agents && npm ci
      - run: cd agents && npx tsx cron/runner.ts cmo threads-token-refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CHANNEL_DASHBOARD: ${{ secrets.SLACK_CHANNEL_DASHBOARD }}
          SLACK_CHANNEL_REPORT: ${{ secrets.SLACK_CHANNEL_REPORT }}
          SLACK_CHANNEL_QA: ${{ secrets.SLACK_CHANNEL_QA }}
          SLACK_CHANNEL_SYSTEM: ${{ secrets.SLACK_CHANNEL_SYSTEM }}
          SLACK_CHANNEL_LOG: ${{ secrets.SLACK_CHANNEL_LOG }}
          SLACK_CHANNEL_AGENT: ${{ secrets.SLACK_CHANNEL_AGENT }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

  channel-seeder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # DISPATCH ONLY — 중단 2026-05-15 (초기 시딩 완료)
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'channel-seeder'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: cd agents && npm ci
      - run: cd agents && npx tsx cron/runner.ts cmo channel-seeder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_LIGHT: claude-haiku-4-5
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CHANNEL_DASHBOARD: ${{ secrets.SLACK_CHANNEL_DASHBOARD }}
          SLACK_CHANNEL_REPORT: ${{ secrets.SLACK_CHANNEL_REPORT }}
          SLACK_CHANNEL_QA: ${{ secrets.SLACK_CHANNEL_QA }}
          SLACK_CHANNEL_SYSTEM: ${{ secrets.SLACK_CHANNEL_SYSTEM }}
          SLACK_CHANNEL_LOG: ${{ secrets.SLACK_CHANNEL_LOG }}
          SLACK_CHANNEL_AGENT: ${{ secrets.SLACK_CHANNEL_AGENT }}

  seo-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'seo-optimizer'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: cd agents && npm ci
      - run: cd agents && npx tsx cron/runner.ts cmo seo-optimizer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_LIGHT: claude-haiku-4-5
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CHANNEL_DASHBOARD: ${{ secrets.SLACK_CHANNEL_DASHBOARD }}
          SLACK_CHANNEL_REPORT: ${{ secrets.SLACK_CHANNEL_REPORT }}
          SLACK_CHANNEL_QA: ${{ secrets.SLACK_CHANNEL_QA }}
          SLACK_CHANNEL_SYSTEM: ${{ secrets.SLACK_CHANNEL_SYSTEM }}
          SLACK_CHANNEL_LOG: ${{ secrets.SLACK_CHANNEL_LOG }}
          SLACK_CHANNEL_AGENT: ${{ secrets.SLACK_CHANNEL_AGENT }}

  google-ads-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # DISPATCH ONLY — google-ads-api 패키지 미설치 + refresh_token 미설정. 준비 완료 시 크론 복원.
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'google-ads-report'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: cd agents && npm ci
      - run: cd agents && npx tsx cron/runner.ts cmo google-ads-report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SLACK_WEBHOOK_REPORT: ${{ secrets.SLACK_WEBHOOK_REPORT }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
