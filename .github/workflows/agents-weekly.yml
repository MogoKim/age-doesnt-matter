name: Agents — Weekly
on:
  schedule:
    # (역사) 월/수/목/금 09:05 KST DOW 분기 cron 은 전 케이스 skip 처리로 2026-05-16 비활성화됐고,
    #        담당 에이전트는 이후 제거됐다. 재도입하지 않는다.
    - cron: "0 1 * * 1"   # F-12: 매주 월 10:00 KST — 30일 경과 탈퇴회원 PII 자동 익명화
    - cron: "30 1 * * 1"  # PR-E: 매주 월 10:30 KST — 주간 Google SEO 스냅샷 (GSC read-only 관측)
  workflow_dispatch:
    inputs:
      agent:
        description: "runner HANDLERS 키의 agent 부분 (예: cto). 유효 키는 agents/cron/runner.ts 의 HANDLERS 참조"
        required: true
      task:
        description: "runner HANDLERS 키의 task 부분 (예: anonymize-withdrawn-apply)"
        required: true

# 이 workflow 가 실행하는 것은 cto:anonymize-withdrawn-apply · cmo:seo-snapshot 둘뿐이다.
# 둘 다 BaseAgent 를 쓰지 않으므로 ANTHROPIC_API_KEY·모델 env 는 두지 않는다.
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_DASHBOARD: ${{ secrets.SLACK_CHANNEL_DASHBOARD }}
  SLACK_CHANNEL_REPORT: ${{ secrets.SLACK_CHANNEL_REPORT }}
  SLACK_CHANNEL_QA: ${{ secrets.SLACK_CHANNEL_QA }}
  SLACK_CHANNEL_SYSTEM: ${{ secrets.SLACK_CHANNEL_SYSTEM }}
  SLACK_CHANNEL_LOG: ${{ secrets.SLACK_CHANNEL_LOG }}
  SLACK_CHANNEL_AGENT: ${{ secrets.SLACK_CHANNEL_AGENT }}
  # 주간 SEO 스냅샷 — Google Search Console read-only 서비스 계정(base64 JSON)
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  # 미설정 시 코드가 sc-domain:age-doesnt-matter.com 으로 fallback 한다
  SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: cd agents && npm ci
      - name: Determine agent and task
        id: determine
        env:
          INPUT_AGENT: ${{ github.event.inputs.agent }}
          INPUT_TASK: ${{ github.event.inputs.task }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # injection 방지: 입력을 env로 받고 allowlist 검증 (소문자·숫자·:_- 만)
            if [[ ! "$INPUT_AGENT" =~ ^[a-z0-9:_-]+$ ]] || [[ -n "$INPUT_TASK" && ! "$INPUT_TASK" =~ ^[a-z0-9:_-]+$ ]]; then
              echo "::error::허용되지 않은 agent/task 입력"; exit 1
            fi
            echo "agent=$INPUT_AGENT" >> $GITHUB_OUTPUT
            echo "task=$INPUT_TASK" >> $GITHUB_OUTPUT
          else
            CRON="${{ github.event.schedule }}"
            case "$CRON" in
              "0 1 * * 1")
                echo "agent=cto" >> $GITHUB_OUTPUT; echo "task=anonymize-withdrawn-apply" >> $GITHUB_OUTPUT ;;
              "30 1 * * 1")
                echo "agent=cmo" >> $GITHUB_OUTPUT; echo "task=seo-snapshot" >> $GITHUB_OUTPUT ;;
              *)
                echo "agent=skip" >> $GITHUB_OUTPUT; echo "task=skip" >> $GITHUB_OUTPUT ;;
            esac
          fi
      - name: Run agent
        if: steps.determine.outputs.agent != 'skip'
        run: cd agents && npx tsx cron/runner.ts ${{ steps.determine.outputs.agent }} ${{ steps.determine.outputs.task }}
