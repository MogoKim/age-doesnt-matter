# ================================================================
# 우나어 헌법 — OPS 모듈
# ================================================================
# 포함: 인기글 정책 + SNS 전략 + CMO 콘텐츠 비율 + 광고 정책 + 인텔리전스 정책
# 대상: CMO (SNS 포스터, 트렌드), COO (트렌딩 스코어러)
# ================================================================

# ──────────────────────────────────────────
# 7. 광고 정책
# ──────────────────────────────────────────
ad_policy:
  types: ["자체 배너", "구글 애드센스", "쿠팡 CPS", "외부 직접"]

  priority_order:
    - "1순위: 외부 직접 (유료 계약)"
    - "2순위: 자체 배너 (이벤트·홍보)"
    - "3순위: 쿠팡 CPS (수익)"
    - "4순위: 구글 애드센스 (기본 fill)"

  rules:
    - "모든 광고에 '광고' 라벨 필수"
    - "모바일: 화면당 최대 1개 광고"
    - "정치/도박/성인/약물/다단계 광고 절대 금지"
    - "쿠팡 CPS: 투명성 안내 문구 필수"

# ──────────────────────────────────────────
# 8-2. 인기글 정책
# ──────────────────────────────────────────
trending_policy:
  score_formula: "(likeCount*3 + commentCount*5 + viewCount*0.1) / (hoursAge+2)^1.5"
  recalculation: "매 30분 (COO trending-scorer)"
  hot_demotion: "72시간 무참여 + 7일 경과 → NORMAL 강등"
  hall_of_fame: "영구 유지 (공감 50개 이상 달성 보상)"
  home_trending: "48시간 이내 게시글, trendingScore 상위 5개"

# ──────────────────────────────────────────
# 10. 인텔리전스 정책 (Intelligence Harness)
# ──────────────────────────────────────────
intelligence_policy:
  # RETIRED (2026-09-09, R4 B-3) — 크롤·분석·브리프 생산자와 소비자가 모두 제거됐다.
  # 정본 설명은 constitution.yaml 의 같은 키를 본다.
  status: "RETIRED (2026-09-09, R4 B-3)"
  daily_brief_mandatory: false
