# ================================================================
# 우나어 헌법 — STRATEGY 모듈
# ================================================================
# 포함: 현재 Phase + KPI + 포지셔닝 + 경쟁 전략
# 대상: CEO (전략 수립), CFO (KPI 분석)
# ================================================================

# ──────────────────────────────────────────
# 6. 현재 Phase & KPI
# ──────────────────────────────────────────
current_phase: "Phase 3 — 리텐션·참여"

kpi:
  phase1_primary: "사용자 사이트 + 어드민 모든 기능 완성 (PRD A/B/C 기준)"

  phase2_traffic:
    north_star: "주간 재방문 참여 유저 수"
    north_star_definition: "최근 7일 안에 재방문했고, 글 또는 댓글을 1회 이상 남긴 고유 사용자 수"
    north_star_rationale: "봇은 재방문하지 않고 봇 글은 이 숫자를 올리지 못한다. '다시 왔다'(리텐션) + '말했다'(참여)를 한 숫자로 본다"
    # ⚠️ DAU·MAU·PV·SEO 클릭·색인 수는 North Star가 아니라 생존/유입 참고지표다.
    #    봇 발행과 검색 유입만으로 오르므로 목표로 삼지 않는다.
    #    단 네이버 유입은 생존 조건이므로 급감 감시는 계속한다.
    survival_reference_only: ["DAU", "MAU", "PV", "SEO 클릭", "색인 수"]
    targets:
      - "DAU/MAU > 0.15"
      - "D7 리텐션 > 20%"
      - "UGC 비율 > 30%"
      - "일자리 지원 클릭 > 50/일"
      - "평균 세션 > 3분"


# ──────────────────────────────────────────
# 11. 포지셔닝 & 경쟁 전략 (2026-04-04 확정)
# ──────────────────────────────────────────
positioning:
  one_line: "우리 나이 여성이 지금의 고민을 나누는 커뮤니티 — 나만 이런 게 아니구나"

  # 감성 축(RELATION) + 실용 축(RETIRE+MONEY) 동시 포지셔닝
  axes:
    emotional: "RELATION — 혼자라는 느낌에서 벗어나는 연결 (왜 오는가)"
    practical: "RETIRE+MONEY — 인생 다음 챕터 준비 (머무르는 이유)"

  headline_message: >
    "혼자 끙끙 앓던 그 고민 — 여기 다 있어요.
    인생 다음 챕터, 같이 준비해요."

  moat:
    - name: "전용 공간"
      desc: "'시니어 플랫폼'이 아닌 우리 나이 여성이 스스로 만드는 커뮤니티 — 체면 없이 진짜 이야기"
    - name: "욕망 설계 구조"
      desc: "RELATION(연결) + RETIRE(인생2막) + MONEY(노후준비) 3축으로 설계된 카테고리"
    - name: "AI 운영 플라이휠"
      desc: "시드봇 콘텐츠 → 실사용자 유입 → 데이터 학습 → 더 나은 콘텐츠 → 재유입"

  competitors:
    naver_cafe:
      strength: "기존 회원 수십만, 검색 유입"
      weakness: "카테고리 파편화, AI 없음, 우리 나이 여성 전용 아님"
      우나어_차별점: "단일 홈 + AI 큐레이션 + 욕망 설계 카테고리"
    band:
      strength: "중장년 사용자 많음, 모임 기능"
      weakness: "폐쇄적 그룹, 검색 노출 없음"
      우나어_차별점: "느슨한 연결 (익명 발견 가능) vs 폐쇄 모임"
    senior_apps:
      strength: "50+ 타겟 명확"
      weakness: "단일 기능(일자리/건강), UX 열악, 규모 극소"
      우나어_차별점: "연결+인생2막+노후준비+일자리 종합 플랫폼"

  conclusion: "직접 경쟁자 없음 — 40대 중반~60대 중반 여성 전용 + AI 운영 + 욕망 설계 종합 커뮤니티는 우나어가 유일"
