<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>거울 보드 — 우나어 상황실</title>
    <style>
      :root {
        --primary: #ff6f61;
        --bg: #0f1117;
        --panel: #1a1d27;
        --card: #232733;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
        font-size: 18px;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid #2a2f3a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      header h1 { font-size: 22px; margin: 0; }
      header h1 .dot { color: var(--primary); }
      #status { font-size: 15px; color: var(--muted); }
      #status .live { color: #22c55e; }
      #status .down { color: #ef4444; }
      main {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        padding: 16px 24px;
        align-items: start;
      }
      @media (max-width: 1200px) { main { grid-template-columns: repeat(3, 1fr); } }
      @media (max-width: 760px) { main { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 460px) { main { grid-template-columns: 1fr; } }
      .col {
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
        min-height: 120px;
      }
      .col h2 {
        font-size: 16px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .col h2 .badge {
        width: 10px; height: 10px; border-radius: 50%;
      }
      .col h2 .count { color: var(--muted); font-size: 14px; }
      .card {
        background: var(--card);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
        border-left: 4px solid transparent;
        transition: transform 0.2s ease;
      }
      .card.null { opacity: 0.6; border-left-color: var(--muted); }
      .card .title { font-size: 16px; font-weight: 600; line-height: 1.35; }
      .card .label { font-size: 15px; color: var(--text); margin-top: 6px; }
      .card .meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
      .card .track {
        display: inline-block; font-size: 12px; padding: 2px 8px;
        border-radius: 6px; background: #2f3442; color: var(--muted); margin-top: 8px;
      }
      .card .stale { color: #fbbf24; font-size: 13px; margin-top: 6px; }
      .empty { color: var(--muted); font-size: 14px; padding: 8px; }
      /* ── 운영 원장 (compact row) ── */
      #summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
      .sm { flex: 1 1 140px; background: #1b1b1b; border: 1px solid #333; border-radius: 8px;
            padding: 9px 12px; min-width: 130px; }
      .sm.hot { border-color: #ef4444; background: #2a1616; }
      .sm .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
      .sm .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .sm.hot .n { color: #f87171; }

      .lsec { margin-bottom: 16px; }
      .lsec > h2 { font-size: 14px; margin: 0 0 7px; font-weight: 600; letter-spacing: .01em; }
      .lsec > h2 .c { color: #6b7280; font-weight: 400; }

      .row { display: block; background: #1b1b1b; border: 1px solid #2f2f2f;
             border-left: 3px solid #3f3f46; border-radius: 6px;
             padding: 9px 12px; margin-bottom: 6px; }
      .row.alert { border-color: #ef4444; border-left-color: #ef4444; background: #241414; }
      .row.locked { opacity: .58; }
      .row .r1 { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
      .row .t { font-size: 14px; font-weight: 600; flex: 1 1 240px; min-width: 0;
                overflow-wrap: anywhere; }
      .row .r2 { font-size: 12.5px; line-height: 1.5; color: #d4d4d8; overflow-wrap: anywhere; }
      .row .r2 b { color: #71717a; font-weight: 500; margin-right: 3px; }
      .row .r3 { font-size: 11.5px; color: var(--muted); margin-top: 4px;
                 display: flex; gap: 10px; flex-wrap: wrap; }
      .row .warn { color: #fca5a5; font-weight: 600; }

      .b { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10.5px;
           font-weight: 600; white-space: nowrap; }
      .b.p0 { background: #7f1d1d; color: #fecaca; }
      .b.p1 { background: #78350f; color: #fed7aa; }
      .b.p2 { background: #3f3f46; color: #d4d4d8; }
      .b.st { background: #1e3a5f; color: #bfdbfe; font-weight: 500; }

      details#probe-box { margin-top: 22px; padding-top: 14px; border-top: 1px solid #2f2f2f; }
      details#probe-box > summary { color: var(--muted); font-size: 13px; cursor: pointer;
                                    padding: 4px 0; }
      details.closed-box { margin-top: 10px; }
      details.closed-box > summary { color: #52525b; font-size: 12px; cursor: pointer; }

      @media (max-width: 640px) {
        .sm { flex: 1 1 100%; }
        .row .t { flex: 1 1 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="dot">●</span> 거울 보드 — 우나어 상황실</h1>
      <div id="status">연결 중…</div>
    </header>
    <div id="summary"></div>
    <section id="ledger"></section>
    <details id="probe-box">
      <summary>🔍 probe 보드 (git·CI·HTTP 실측 자동 판정) — 펼치기</summary>
      <main id="board"></main>
    </details>
    <script src="/board.js"></script>
  </body>
</html>
